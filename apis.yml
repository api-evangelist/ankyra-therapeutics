name: Ankyra Therapeutics
description: 'Ankyra Therapeutics is a clinical-stage biotechnology company based in Cambridge,
  Massachusetts, developing "anchored" immunotherapies for cancer and immune-mediated diseases. Its
  proprietary platform tethers immune-modulating drugs to aluminum hydroxide so that treatment
  concentrates locally at the disease site, broadening the therapeutic window while reducing systemic
  toxicity and dosing frequency. The lead candidate, ANK-101, is an anchored IL-12 therapy in clinical
  evaluation for patients with advanced solid tumors. Ankyra is backed by investors including Google
  Ventures (GV), Mithril, Polaris Partners, Sands Capital, and Fidelity. The company publishes no public
  developer API, SDK, or technical platform; this profile exists in the API Evangelist network for
  discovery and enrichment.'
